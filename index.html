<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Hall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-head">
    <div class="site-head__mark">
      <span class="site-head__index" id="pieceCount">00</span>
      <span class="site-head__rule"></span>
    </div>
    <h1 class="site-head__title">Great Hall</h1>
    <p class="site-head__sub">personal gallery, images and concepts generated by AItools | <a
        style="color: aliceblue; text-decoration: none;" href="https://github.com/liberstack">github.com/liberstack
        ↗</a>
    </p>
  </header>

  <nav class="filters" id="filters" aria-label="Filtrar por tag"></nav>

  <main class="wall" id="wall">
    <!-- itens injetados via script.js -->
  </main>

  <p class="empty-state" id="emptyState" hidden>Nada nessa galeria ainda.</p>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer__backdrop" data-close></div>
    <button class="viewer__close" data-close aria-label="Fechar">✕</button>
    <button class="viewer__nav viewer__nav--prev" id="prevBtn" aria-label="Anterior">‹</button>
    <button class="viewer__nav viewer__nav--next" id="nextBtn" aria-label="Próxima">›</button>
    <figure class="viewer__frame">
      <img class="viewer__img" id="viewerImg" alt="">
      <figcaption class="viewer__plate">
        <span class="viewer__plate-index" id="viewerIndex">00</span>
        <span class="viewer__plate-name" id="viewerName"></span>
        <span class="viewer__plate-tags" id="viewerTags"></span>
      </figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>

</html>
